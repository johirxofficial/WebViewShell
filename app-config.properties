# =====================================================================
#   YOUR APP, IN ONE FILE
#
#   Change anything below, then rebuild. Nothing else needs editing.
#   Android Studio: Build > Rebuild Project
#   Command line:   ./gradlew assembleDebug
# =====================================================================

# ------------------------- IDENTITY ----------------------------------

# Your website or web app. This opens when the app launches.
start_url=https://www.google.com

# Name shown under the launcher icon.
app_name=google.com

# Unique app id (also called package name / application id).
# Use a domain you own, written backwards: com.yourname.yourapp
# Rules: at least two dots, no spaces, no dashes, lowercase.
app_id=com.google-web-app.com

# Version info. version_code must be a whole number - increase it
# every time you publish an update.
version_code=1
version_name=1.0.0

# --------------------------- LOGO ------------------------------------

# Name of a drawable in app/src/main/res/drawable/ (without extension).
# Put your own file there as "logo.png" or "logo.xml" and leave this
# as "logo", or rename your file (e.g. "my_brand") and update this line.
# Tip: a 512x512 PNG with transparent background works well.
app_logo=logo

# -------------------------- COLORS -----------------------------------
# Keep the # prefix. Supported: #RGB, #RRGGBB, #AARRGGBB

color_brand=#4338CA
color_brand_dark=#312E81
color_brand_light=#6366F1
color_on_brand=#FFFFFF
color_background=#FFFFFF
color_text_primary=#111827
color_text_secondary=#6B7280

# Status bar. Leave empty to use color_brand.
color_status_bar=#4338CA

# Launcher icon background (adaptive icon).
color_icon_background=#4338CA

# Splash screen background. Leave empty to use color_brand.
color_splash_background=#4338CA

# ------------------------- BEHAVIOUR ---------------------------------
# true / false only

# Pull down from the top of the page to reload.
enable_pull_to_refresh=true

# Keep audio/video playing when the user switches to another app.
keep_audio_playing_in_background=true

# false = every link stays inside the app (recommended).
# true  = tel:, mailto:, market: links open in other apps.
open_non_web_links_in_other_apps=false

# Thin loading bar under the status bar.
show_loading_bar=true

# Allow plain http:// sites. Set to false for a stricter release.
allow_cleartext_traffic=true

# Pinch to zoom (off feels more app-like).
enable_pinch_zoom=false

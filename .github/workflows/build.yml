name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify app-config.properties was applied
        run: |
          set -e
          MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' | head -n 1)
          CONFIG_APP_ID=$(grep -E '^app_id=' app-config.properties | cut -d= -f2- | tr -d '[:space:]')
          MANIFEST_APP_ID=$(grep -o 'package="[^"]*"' "$MANIFEST" | head -n 1 | cut -d'"' -f2)
          echo "app_id (config)   = $CONFIG_APP_ID"
          echo "app_id (manifest) = $MANIFEST_APP_ID"
          # debug builds append ".debug" via applicationIdSuffix
          case "$MANIFEST_APP_ID" in
            "$CONFIG_APP_ID"|"$CONFIG_APP_ID".debug) echo "app_id OK" ;;
            *) echo "app_id mismatch"; exit 1 ;;
          esac
          CONFIG_NAME=$(grep -E '^app_name=' app-config.properties | cut -d= -f2- | sed 's/^ *//;s/ *$//')
          echo "app_name (config) = $CONFIG_NAME"
          grep -q "app_name" "$(find app/build/generated -name 'gradleResValues.xml' | head -n 1)"
          grep -o 'usesCleartextTraffic="[^"]*"' "$MANIFEST"
          echo "logo alias:"; cat app/build/generated/appConfig/res/values/app_logo.xml

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebViewShell-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
